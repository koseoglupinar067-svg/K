name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "=== Gradle wrapper ==="
          ls -la gradlew
          echo "=== Project ==="
          ls -la
          echo "=== Gradle files ==="
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle*" -o -name "build.gradle*" \) -print

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "=== APK ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
